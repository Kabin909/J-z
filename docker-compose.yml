services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jz}
      POSTGRES_USER: ${POSTGRES_USER:-jz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - jz-postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    env_file: .env
    environment:
      PORT: 4000
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["127.0.0.1:4000:4000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build: {context: ., dockerfile: apps/worker/Dockerfile}
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  ws:
    build: {context: ., dockerfile: apps/ws/Dockerfile}
    env_file: .env
    environment:
      PORT: 4001
    ports: ["127.0.0.1:4001:4001"]
    depends_on: [api, redis]
    restart: unless-stopped

  web:
    build: {context: ., dockerfile: apps/web/Dockerfile}
    depends_on: [api]
    ports: ["127.0.0.1:5173:80"]
    restart: unless-stopped

volumes:
  jz-postgres:
